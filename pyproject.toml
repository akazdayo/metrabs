[project]
name = "metrabs"
version = "0.1.0"
description = "PyTorch/OSC webcam runner for the akazdayo/metrabs fork"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "addict",
    "cameralib",
    "einops",
    "hydra-core",
    "imageio",
    "jpeg4py",
    "opencv-python>=4.11.0.86",
    "posepile",
    "python-osc>=1.9.3",
    "torch>=2.12.0",
    "torchvision>=0.24.1",
    "ultralytics",
]

[project.optional-dependencies]
convert = [
    "tensorflow==2.15",
    "tensorflow-hub>=0.16.1",
]

[tool.uv.sources]
cameralib = { git = "https://github.com/isarandi/cameralib.git" }
posepile = { git = "https://github.com/isarandi/posepile.git" }
